name: Deploy API

on:
  push:
    branches:
      - 'feature/**'
      - qa
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      branch:
        description: Branch to deploy
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref_name, 'feature/') && 'dev' || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref_name, 'feature/') && 'dev' || github.ref_name) }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}

    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DEPLOY_ENV="${{ inputs.environment }}"
            DEPLOY_BRANCH="${{ inputs.branch }}"
          else
            DEPLOY_BRANCH="${GITHUB_REF_NAME}"
            if [[ "${DEPLOY_BRANCH}" == feature/* ]]; then
              DEPLOY_ENV="dev"
            else
              DEPLOY_ENV="${DEPLOY_BRANCH}"
            fi
          fi

          echo "environment=${DEPLOY_ENV}" >> "${GITHUB_OUTPUT}"
          echo "branch=${DEPLOY_BRANCH}" >> "${GITHUB_OUTPUT}"

          echo "Deploy environment: ${DEPLOY_ENV}"
          echo "Deploy branch: ${DEPLOY_BRANCH}"

      - name: Checkout application repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v aws
          command -v jq
          command -v docker
          command -v git

      - name: Run ECS deploy script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/setup_api.sh
          bash scripts/deploy/setup_api.sh \
            "${{ steps.target.outputs.environment }}" \
            "${{ steps.target.outputs.branch }}"
