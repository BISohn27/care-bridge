name: Deploy API

on:
  push:
    branches:
      - 'feature/**'
      - qa
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      branch:
        description: Branch to deploy
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref_name, 'feature/') && 'dev' || github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref_name, 'feature/') && 'dev' || github.ref_name) }}

    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "${GITHUB_OUTPUT}"
            echo "branch=${{ inputs.branch }}" >> "${GITHUB_OUTPUT}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            ENV=$([[ "${BRANCH}" == feature/* ]] && echo "dev" || echo "${BRANCH}")
            echo "environment=${ENV}" >> "${GITHUB_OUTPUT}"
            echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run ECS deploy script
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          chmod +x scripts/deploy/setup_api.sh
          bash scripts/deploy/setup_api.sh \
            "${{ steps.target.outputs.environment }}" \
            "${{ steps.target.outputs.branch }}"
